[book]
title = "@deckyard/git"
description = "Work with git repositories through the git command line: status, commit, log, diff, branches, tags, remotes, with hardened defaults"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "ember"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-git/"
repoUrl = "https://github.com/deckyard/deck-git"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-git/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
